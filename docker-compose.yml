services:
  docs:
    build: .
    ports:
      - "8080:8080"
    environment:
      IRMIK_ENV: production
      IRMIK_HOST: 0.0.0.0
      IRMIK_PORT: "8080"
      # Required in production. Set in Dokploy (or a local .env); do not commit secrets.
      IRMIK_JWT_SECRET: ${IRMIK_JWT_SECRET}
      # Optional public origin for absolute Open Graph / Twitter image URLs (e.g. https://docs.example.com).
      SITE_URL: ${SITE_URL:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
